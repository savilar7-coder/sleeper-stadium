<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Sleeper Stadium</title>
  <meta name="description" content="Your Sleeper fantasy league as a live pixel stadium.">
  <meta property="og:title" content="Sleeper Stadium">
  <meta property="og:image" content="https://savilar7-coder.github.io/sleeper-stadium/og.png">
  <meta property="og:url" content="https://savilar7-coder.github.io/sleeper-stadium/">
  <meta name="twitter:card" content="summary_large_image">
  <meta property="og:description" content="Your Sleeper fantasy league as a live pixel stadium: live scores, touchdown alerts, the top scorer in the spotlight, the ASS Bowl and the bench of shame.">
  <link rel="icon" href="assets/icon-192.png">
  <link rel="apple-touch-icon" href="assets/icon-180.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#20262e">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600&display=swap">
  <link rel="stylesheet" href="village.css">
  <link rel="stylesheet" href="stadium.css">
  <link rel="preconnect" href="https://api.sleeper.app" crossorigin>
</head>
<body>
  <div id="game"></div>
  <div id="st-hud">
    <button id="st-fold" type="button" aria-label="Fold the top bar">▴</button>
    <div id="st-league">Loading the league from Sleeper…</div>
    <div id="st-score"></div>
    <div id="st-proj"></div>
    <div class="st-btns"><button id="st-mine" type="button">👑 My team</button><button id="st-trade" type="button">🔁 Trade</button><button id="st-news" type="button">📰 News</button><button id="st-table" type="button">🏆 Table</button></div>
  </div>
  <div id="st-ticker" hidden><span></span></div> 
  <div id="prompt" hidden></div>
  <div id="stick" hidden><div id="stick-knob"></div></div>
  <div id="zoom-ctl"><button id="zoom-in" type="button" aria-label="Zoom in">＋</button><button id="zoom-out" type="button" aria-label="Zoom out">－</button></div>
  <button id="jump-btn" type="button" aria-label="Matchup" hidden>⚔️ Matchup</button> 
  <button id="play-btn" type="button" hidden>🏈 Play</button> 
  <div id="mg-hud" hidden><div id="mg-score"></div><div id="mg-down"></div><div id="mg-msg"></div><div class="mg-btns"><button id="mg-again" type="button">↻ Again</button><button id="mg-exit" type="button">✕ Back to stadium</button></div></div>
  <div id="zoom-hint" hidden>🔍 Pinch out to fit</div>
  <div id="panel" hidden role="dialog" aria-modal="true" aria-labelledby="panel-title">
    <div class="panel-head"><h2 id="panel-title"></h2><button id="panel-close" type="button" aria-label="Close">✕</button></div>
    <div id="panel-body"></div>
  </div>
  <script src="vendor/phaser.min.js"></script>
  <script type="module" src="js/stadium-main.js"></script>
<button id="share-lg" type="button" hidden style="position:fixed;right:10px;bottom:88px;z-index:50;font:600 13px system-ui,sans-serif;color:#1d140c;background:#ffd84a;border:1px solid #9e7c0c;border-radius:16px;padding:6px 11px;box-shadow:0 2px 6px #0006">&#128279; Share your stadium</button>
<script>
(function () {
  var b = document.getElementById('share-lg'), id = '';
  try { id = (new URLSearchParams(location.search).get('league') || localStorage.getItem('st-league-id') || '').replace(/[^0-9]/g, ''); } catch (e) {}
  if (!id) return;
  b.hidden = false;
  var q = new URLSearchParams(location.search); q.set('league', id); q.delete('v'); q.delete('notitle');
  var url = location.origin + location.pathname + '?' + q.toString();  // keeps a League Pass's blimp + looks
  b.onclick = function () {
    if (navigator.share) { navigator.share({ title: 'Our league stadium', url: url }).catch(function () {}); return; }
    var done = function () { b.textContent = '\u2705 Link copied'; setTimeout(function () { b.innerHTML = '&#128279; Share your stadium'; }, 2000); };
    if (navigator.clipboard) navigator.clipboard.writeText(url).then(done, function () { prompt('Copy this link:', url); });
    else prompt('Copy this link:', url);
  };
})();
</script>
<a id="gh-star" href="https://github.com/savilar7-coder/sleeper-stadium" target="_blank" rel="noopener" style="position:fixed;right:10px;bottom:48px;z-index:50;font:600 13px system-ui,sans-serif;color:#fff;background:#24292f;border:1px solid #57606a;border-radius:16px;padding:6px 11px;text-decoration:none;box-shadow:0 2px 6px #0006">&#11088; Star on GitHub &middot; free &amp; open source</a>
</body>
</html>
